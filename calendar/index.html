<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캘린더·진도표·학생기록</title>

<!-- iOS 홈 화면 추가 시 주소창 없이 전체화면으로 열리게 하는 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수업기록">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563EB">

<!-- 홈 화면 아이콘 (아이폰 홈 화면에 추가할 때 쓰는 아이콘) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- 브라우저 탭에 표시되는 아이콘(파비콘). 같은 폴더에 아래 파일들을 함께 올려주세요 -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">

<!-- 안드로이드 크롬에서 "홈 화면에 추가" 시 아이폰처럼 전체화면 앱으로 열리게 하는 설정 -->
<link rel="manifest" href="manifest.json">

<!-- 학생 명단 엑셀(.xlsx) 업로드 파싱용 라이브러리 (인터넷 연결 필요) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --blue:#2563EB; --blue-light:#DBEAFE; --blue-lighter:#EFF6FF; --blue-dark:#1D4ED8;
    --orange:#EA580C; --orange-dark:#C2410C; --orange-light:#FFEDD5;
    --purple:#7C3AED; --purple-light:#F3E8FF;
    --gray-bg:#F5F5F4; --gray-border:#E5E7EB; --gray-text:#6B7280; --gray-faint:#9CA3AF;
    --ink:#1F2937; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;height:100dvh;height:calc(var(--app-vh, 1vh) * 100);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--gray-bg);}
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}

  /* ---------- 잠금 화면 ---------- */
  #pinGate{position:fixed;inset:0;background:var(--gray-bg);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .pin-box{background:#fff;border:1px solid var(--gray-border);border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center;}
  .pin-box input{width:100%;box-sizing:border-box;font-size:20px;letter-spacing:8px;text-align:center;padding:12px;border:1px solid var(--gray-border);border-radius:10px;margin-top:12px;}
  .pin-box button{width:100%;margin-top:14px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;}

  /* ---------- 전체 앱 셸 ---------- */
  #app{display:none;flex-direction:column;height:100%;height:100dvh;height:calc(var(--app-vh, 1vh) * 100);max-width:520px;width:100%;margin:0 auto;background:var(--gray-bg);position:relative;padding-top:env(safe-area-inset-top);box-sizing:border-box;}
  .screen{display:none;flex-direction:column;height:100%;min-height:0;}
  .screen.active{display:flex;}
  .scroll-area{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- 상단 공통 헤더(뒤로가기용) ---------- */
  .subheader{display:flex;align-items:center;gap:10px;padding:18px 20px 8px;flex-shrink:0;}
  .back-btn{text-decoration:none;color:var(--gray-text);font-size:20px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:8px;}
  .subheader .title{font-size:16px;font-weight:700;}

  /* ---------- 캘린더 화면 ---------- */
  .cal-header{flex-shrink:0;padding:18px 20px 8px;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;}
  .cal-nav button{border:none;background:none;font-size:20px;color:var(--gray-faint);padding:6px 10px;border-radius:8px;}
  .cal-nav .month-label{font-size:17px;font-weight:700;}
  .quick-banner{margin:12px 0 10px;padding:14px 16px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .quick-banner .qb-sub{font-size:11px;color:#BFDBFE;font-weight:600;letter-spacing:.02em;}
  .quick-banner .qb-main{font-size:15px;color:#fff;font-weight:700;margin-top:3px;}
  .quick-banner button{text-decoration:none;background:#fff;color:var(--blue);font-size:13px;font-weight:700;padding:9px 14px;border-radius:8px;border:none;white-space:nowrap;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 4px;margin-top:2px;}
  .weekday-row div{text-align:center;font-size:11px;font-weight:700;color:var(--gray-faint);padding:4px 0;}
  .weekday-row div:first-child{color:#F97316;}
  .weekday-row div:last-child{color:var(--blue);}
  .day-grid-wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 10px;}
  .day-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:76px;gap:4px;}
  .day-cell{border:none;background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;font-family:inherit;position:relative;}
  .day-cell.other-month{background:transparent;}
  .day-cell .dnum{font-size:13px;color:var(--ink);}
  .day-cell.today{background:var(--blue-light);border:1.5px solid var(--blue);}
  .day-cell.today .dnum{color:var(--blue-dark);font-weight:700;}
  .day-cell .dots{display:flex;gap:2px;margin-top:4px;}
  .dot{width:5px;height:5px;border-radius:50%;}
  .dot.blue{background:var(--blue);} .dot.orange{background:var(--orange);} .dot.gray{background:var(--gray-faint);}

  /* ---------- 하단 탭바 ---------- */
  #tabbar{flex-shrink:0;display:flex;align-items:center;border-top:1px solid var(--gray-border);background:#fff;padding:6px 8px calc(8px + env(safe-area-inset-bottom));}
  #tabbar.hidden{display:none;}
  .tabbtn{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 0;flex:1;color:var(--gray-faint);}
  .tabbtn.active{color:var(--blue);}

  /* ---------- 날짜상세 화면 ---------- */
  .period-list{padding:10px 20px 16px;display:flex;flex-direction:column;gap:12px;}
  .section-label{font-size:11px;color:var(--gray-faint);font-weight:700;letter-spacing:.03em;margin-top:6px;}
  .card{background:#fff;border-radius:12px;padding:14px 16px;border:1px solid var(--gray-border);}
  .card.warn{border:1.5px solid #FDBA74;}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .card-top .cname{font-size:14px;font-weight:700;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;}
  .badge.blue{color:var(--blue);background:var(--blue-light);}
  .badge.orange{color:var(--orange-dark);background:var(--orange-light);}
  .badge.gray{color:var(--gray-text);background:#F3F4F6;}
  .card .sub{font-size:12.5px;color:var(--gray-text);margin-top:6px;}
  .card-actions{display:flex;gap:8px;margin-top:10px;}
  .btn{border:none;border-radius:8px;padding:9px 0;font-size:12px;font-weight:700;flex:1;font-family:inherit;}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.secondary{background:var(--blue-lighter);color:var(--blue);}
  .btn.ghost{background:#F3F4F6;color:var(--gray-text);}
  .btn.full{width:100%;}
  .btn.danger-ghost{background:#FEF2F2;color:#B91C1C;}
  .link-btn{background:none;border:none;color:var(--blue);font-size:12px;font-weight:700;padding:6px 0;font-family:inherit;}

  /* ---------- 진도표 화면 ---------- */
  .pad-screen{padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px;}
  .row-flex{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  select.term-select{font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--gray-border);border-radius:8px;padding:8px 10px;}
  .class-card{background:#fff;border:1px solid var(--gray-border);border-radius:12px;padding:13px 15px;margin-bottom:8px;}
  .class-card .ct{display:flex;justify-content:space-between;align-items:center;}
  .bar-track{width:100%;height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;border-radius:4px;}
  .tl-entry{display:flex;gap:10px;padding:9px 0;border-left:3px solid var(--gray-border);padding-left:12px;}
  .tl-entry.now{border-left:3px solid var(--blue);}
  .tl-entry .tld{font-size:12px;color:var(--gray-faint);width:78px;flex-shrink:0;}
  .tl-entry.now .tld{color:var(--blue);font-weight:700;}
  .tl-entry .tlc{font-size:12.5px;color:var(--ink);}

  /* ---------- 학생기록 화면 ---------- */
  .search-box{width:100%;box-sizing:border-box;font-size:13px;padding:9px 12px;border:1px solid var(--gray-border);border-radius:8px;background:#fff;}
  .stu-layout{display:flex;flex-direction:column;gap:16px;}
  .stu-list-col{width:100%;}
  .stu-detail-col{flex:1;min-width:0;}
  .stu-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-size:13px;background:#fff;border:1px solid var(--gray-border);margin-bottom:6px;}
  .stu-row.sel{background:var(--blue-lighter);border-left:3px solid var(--blue);font-weight:700;}
  .stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat-tile{background:#fff;border:1px solid var(--gray-border);border-radius:10px;padding:10px 12px;}
  .stat-tile .stn{font-size:10.5px;color:var(--gray-faint);font-weight:700;}
  .stat-tile .stv{font-size:18px;font-weight:700;margin-top:2px;}
  .rec-item{padding:9px 0;border-bottom:1px solid #F1F1EF;display:flex;gap:9px;align-items:flex-start;}
  .rec-item .rdate{font-size:11px;color:var(--gray-faint);width:44px;flex-shrink:0;margin-top:2px;}
  .tag-badge{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;}
  .tag-badge.발표{color:var(--blue);background:var(--blue-light);}
  .tag-badge.태도{color:var(--orange-dark);background:var(--orange-light);}
  .tag-badge.특이사항{color:var(--purple);background:var(--purple-light);}

  /* ---------- 설정 화면 ---------- */
  .settings-section{background:#fff;border:1px solid var(--gray-border);border-radius:12px;padding:16px 18px;margin-bottom:14px;break-inside:avoid;}
  .settings-section .sst{font-size:13.5px;font-weight:700;margin-bottom:10px;}
  .tt-grid{display:grid;grid-template-columns:44px repeat(5,1fr);gap:3px;}
  .tt-cell{display:flex;align-items:center;justify-content:center;font-size:11.5px;border-radius:6px;padding:8px 2px;background:#F9FAFB;color:var(--gray-faint);}
  .tt-cell.assigned{background:var(--blue-lighter);color:var(--blue);font-weight:700;border:none;}
  button.tt-cell{border:none;font-family:inherit;}
  .cal-row-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F1F1EF;font-size:12.5px;}
  .cal-row-item:last-child{border-bottom:none;}
  .iconbtn{border:none;background:none;font-size:13px;color:var(--gray-faint);width:26px;height:26px;border-radius:6px;font-family:inherit;}
  .field{margin-bottom:10px;}
  .field label{font-size:11.5px;color:var(--gray-text);font-weight:600;display:block;margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;box-sizing:border-box;font-size:13px;padding:9px 10px;border:1px solid var(--gray-border);border-radius:8px;background:#fff;}
  .field textarea{resize:vertical;min-height:56px;}
  .upload-drop{border:1.5px dashed #C7CDD6;border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:#fff;}

  /* ---------- 모달 ---------- */
  #modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:150;}
  #modalOverlay.open{display:flex;}
  #modalBody{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
  .modal-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .modal-title button{border:none;background:none;font-size:18px;color:var(--gray-faint);}

  /* ---------- 토스트 ---------- */
  #toastContainer{position:fixed;left:0;right:0;bottom:76px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:300;pointer-events:none;}
  .toast{padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:600;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15);}
  .toast.ok{background:#111827;}
  .toast.error{background:#B91C1C;}

  .empty-hint{font-size:12px;color:var(--gray-faint);text-align:center;padding:20px 0;}

  /* ---------- 태블릿·데스크탑: 화면을 넓게 활용 ---------- */
  @media (min-width:700px){
    #app{max-width:960px;}
    .day-grid{grid-auto-rows:82px;}
    .day-cell .dnum{font-size:14px;}
    #settingsBody{display:block;column-count:2;column-gap:18px;}
    #settingsBody .settings-section{display:inline-block;width:100%;margin-bottom:14px;}
    .stu-layout{flex-direction:row;align-items:flex-start;}
    .stu-list-col{width:260px;flex-shrink:0;}
  }
  @media (min-width:1200px){
    #app{max-width:1240px;}
  }
</style>
</head>
<body>

<!-- ================= 잠금 화면 ================= -->
<div id="pinGate">
  <div class="pin-box">
    <div id="pinTitle" style="font-size:15px;font-weight:700;">잠금 해제</div>
    <div style="font-size:11.5px;color:var(--gray-faint);margin-top:4px;">숫자 6자리를 입력해주세요.</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" onkeydown="if(event.key==='Enter') submitPin();">
    <button onclick="submitPin()">확인</button>
  </div>
</div>

<!-- ================= 앱 본체 ================= -->
<div id="app">

  <!-- ---------- 캘린더 ---------- -->
  <div class="screen active" id="screen-calendar">
    <div class="cal-header">
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="month-label" id="monthLabel">2026년 9월</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="quick-banner" id="quickBanner">
        <div>
          <div class="qb-sub" id="qbSub">지금</div>
          <div class="qb-main" id="qbMain">불러오는 중...</div>
        </div>
        <button onclick="goQuickRecord()">바로 기록</button>
      </div>
      <div class="weekday-row"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    </div>
    <div class="day-grid-wrap"><div class="day-grid" id="dayGrid"></div></div>
  </div>

  <!-- ---------- 날짜상세 ---------- -->
  <div class="screen" id="screen-daydetail">
    <div class="subheader">
      <button class="back-btn" onclick="showScreen('calendar')">‹</button>
      <div class="title" id="ddTitle">날짜</div>
    </div>
    <div class="scroll-area"><div class="period-list" id="ddBody"></div></div>
  </div>

  <!-- ---------- 진도표 ---------- -->
  <div class="screen" id="screen-progress">
    <div class="scroll-area"><div class="pad-screen" id="progressBody"></div></div>
  </div>

  <!-- ---------- 학생기록 ---------- -->
  <div class="screen" id="screen-students">
    <div class="scroll-area"><div class="pad-screen" id="studentsBody"></div></div>
  </div>

  <!-- ---------- 설정 ---------- -->
  <div class="screen" id="screen-settings">
    <div class="scroll-area"><div class="pad-screen" id="settingsBody"></div></div>
  </div>

  <!-- ---------- 하단 탭바 ---------- -->
  <div id="tabbar">
    <button class="tabbtn active" data-tab="calendar" onclick="showScreen('calendar')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      캘린더
    </button>
    <button class="tabbtn" data-tab="progress" onclick="showScreen('progress')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M12 19V5M20 19v-6"/></svg>
      진도표
    </button>
    <button class="tabbtn" data-tab="students" onclick="showScreen('students')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      학생기록
    </button>
    <button class="tabbtn" data-tab="settings" onclick="showScreen('settings')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.067-.397.1-.797.1-1.2z"/></svg>
      설정
    </button>
  </div>
</div>

<!-- ================= 모달 ================= -->
<div id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div id="modalBody"></div>
</div>

<div id="toastContainer"></div>

<script>
/* ---------------------- 아이폰 홈 화면 추가(standalone) 화면 높이 보정 ----------------------
   iOS에서 홈 화면에 추가한 앱을 실행하면 아주 잠깐 실제 화면 높이와 다른 값으로
   계산됐다가, 화면을 스와이프해야 바로잡히는 경우가 있어요. window.innerHeight를
   기준으로 --app-vh 값을 직접 계산해서 넣어주면, 스와이프 없이도 처음부터
   하단 탭바가 화면 맨 아래에 딱 맞게 표시돼요. */
function setAppVH(){
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty('--app-vh', (h*0.01)+'px');
}
setAppVH();
window.addEventListener('resize', setAppVH);
window.addEventListener('orientationchange', ()=>setTimeout(setAppVH,150));
window.addEventListener('pageshow', setAppVH);
if(window.visualViewport){ window.visualViewport.addEventListener('resize', setAppVH); }
setTimeout(setAppVH,300);
setTimeout(setAppVH,800);

/* iOS 홈 화면 추가(standalone) 앱은 실행 직후 내부적으로 잘못된 화면 높이를 들고 있다가
   화면을 스크롤(스와이프)해야 그때서야 바로잡는 경우가 있어요. 사용자가 직접 스와이프하지
   않아도 되도록, 아주 살짝 스크롤이 생기게 만들었다가 곧바로 원위치로 되돌리는 방식으로
   그 "스와이프 한 번"을 코드로 대신 해줘요. */
let _recalcRunning = false;
function forceViewportRecalc(){
  if(_recalcRunning) return; // 겹쳐서 실행되면 서로의 임시 상태를 원래 값으로 착각해 고정돼버려요
  _recalcRunning = true;
  document.body.style.height = (window.innerHeight+2)+'px';
  window.scrollTo(0,1);
  requestAnimationFrame(()=>{
    window.scrollTo(0,0);
    setAppVH();
    setTimeout(()=>{
      document.body.style.height = '';
      setAppVH();
      _recalcRunning = false;
    }, 60);
  });
}
forceViewportRecalc();
setTimeout(forceViewportRecalc, 350);

/* =========================================================================
   데이터 구조 (Firebase Realtime Database)
   /config/currentTerm            : "2026-2"
   /config/terms/{termId}         : { targetSessions:number }
   /config/periodTimes            : { "1":"09:00-09:50", ... }
   /timetable/{termId}/{요일}/{교시}      : "2-1"
   /academicCalendar/{termId}/{id}        : {start,end,type,memo}
   /periodOverrides/{termId}/{dateKey}/{교시} : {type:'event'|'other', memo, countSession}
   /students/{termId}/{studentId}         : {class, number, name}
   /progress/{termId}/{반이름}/{entryId}   : {seq,date,period,material,startPoint,endPoint,unit,note,createdAt}
   /studentRecords/{termId}/{recordId}    : {studentId,studentName,class,date,tag,note,createdAt}
   /personalEvents/{termId}/{dateKey}/{id} : {time,text}
   ========================================================================= */

// ⚠️ 아래 주소를 본인의 Firebase Realtime Database 주소로 바꿔주세요.
// (Firebase 콘솔 > Realtime Database 에서 확인할 수 있어요. 칼각매치 만들 때 쓰신 방식과 동일해요.)
const FIREBASE_DB_URL = "https://class-calendar-85548-default-rtdb.asia-southeast1.firebasedatabase.app";

const WEEKDAY_KR = ['일','월','화','수','목','금','토'];
const WEEKDAY_EN = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_LABELS_5 = ['mon','tue','wed','thu','fri'];
const DAY_LABELS_5_KR = ['월','화','수','목','금'];
const DEFAULT_PERIOD_TIMES = {1:"09:00-09:50",2:"10:00-10:50",3:"11:00-11:50",4:"12:00-12:50",5:"14:00-14:50",6:"15:00-15:50",7:"16:00-16:50"};
const TAG_LIST = ['발표','태도','특이사항'];

let STATE = {
  termId: null,
  targetSessions: 0,
  periodTimes: {},
  timetable: {},
  academicCalendar: {},
  periodOverrides: {},
  dayOverrides: {},
  students: {},
  progress: {},
  studentRecords: {},
  personalEvents: {},
  currentMonthDate: new Date(),
  selectedDateKey: null,
  selectedStudentId: null,
  studentSearch: ''
};

/* ---------------------- 날짜 유틸 ---------------------- */
function pad(n){ return n.toString().padStart(2,'0'); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDateKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function fmtShort(k){ const d=parseDateKey(k); return `${d.getMonth()+1}/${d.getDate()}`; }
function todayKey(){ return dateKey(new Date()); }
function defaultTermId(){
  const now=new Date(); const y=now.getFullYear(); const m=now.getMonth()+1;
  return (m>=3 && m<=8) ? `${y}-1` : (m<3 ? `${y-1}-2` : `${y}-2`);
}

/* ---------------------- Firebase REST 헬퍼 ---------------------- */
function dbPath(p){ return `${FIREBASE_DB_URL}/${p}.json`; }
async function dbGet(p){
  try{
    const res = await fetch(dbPath(p));
    if(!res.ok) throw new Error(res.status);
    return await res.json();
  }catch(e){
    toast('불러오기 실패 · 인터넷 연결을 확인해주세요','error');
    return null;
  }
}
async function dbSet(p,data){
  try{
    const res = await fetch(dbPath(p),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!res.ok) throw new Error(res.status);
    toast('저장됨','ok');
    return await res.json();
  }catch(e){ toast('저장 실패 · 다시 시도해주세요','error'); throw e; }
}
async function dbPush(p,data){
  try{
    const res = await fetch(dbPath(p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!res.ok) throw new Error(res.status);
    toast('저장됨','ok');
    return await res.json();
  }catch(e){ toast('저장 실패 · 다시 시도해주세요','error'); throw e; }
}
async function dbRemove(p){
  try{
    const res = await fetch(dbPath(p),{method:'DELETE'});
    if(!res.ok) throw new Error(res.status);
    toast('삭제됨','ok');
  }catch(e){ toast('삭제 실패 · 다시 시도해주세요','error'); throw e; }
}

function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast '+(type||'ok');
  el.textContent=msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

/* ---------------------- 잠금 화면 ---------------------- */
function checkPinGate(){
  const savedPin = localStorage.getItem('appPin');
  const gate = document.getElementById('pinGate');
  if(!savedPin){
    document.getElementById('pinTitle').textContent='앱 잠금 설정 (숫자 6자리)';
  } else {
    document.getElementById('pinTitle').textContent='잠금 해제';
  }
  gate.style.display='flex';
  setTimeout(()=>{ const el=document.getElementById('pinInput'); if(el) el.focus(); }, 0);
  // 아이폰 홈 화면 추가(standalone) 앱에서는 사용자가 화면을 한 번 터치하기 전에는
  // 자동 focus()로 키보드가 뜨지 않아요. 화면 아무 곳이나 처음 터치하면 바로
  // 입력창에 커서가 들어가도록 한 번만 동작하는 리스너를 걸어둬요.
  const focusOnce = ()=>{ const el=document.getElementById('pinInput'); if(el) el.focus(); };
  gate.addEventListener('touchstart', focusOnce, { once:true, passive:true });
  gate.addEventListener('click', focusOnce, { once:true });
}
function submitPin(){
  const savedPin = localStorage.getItem('appPin');
  const val = document.getElementById('pinInput').value.trim();
  if(!/^\d{6}$/.test(val)){ alert('숫자 6자리로 입력해주세요'); return; }
  if(!savedPin){
    localStorage.setItem('appPin', val);
    unlockApp();
  } else {
    if(val===savedPin) unlockApp();
    else alert('번호가 틀렸어요');
  }
}
function resetPin(){
  if(confirm('잠금 번호를 초기화할까요? 다음에 열 때 새 번호를 설정하게 돼요.')){
    localStorage.removeItem('appPin');
    toast('잠금 번호가 초기화됐어요','ok');
  }
}
function unlockApp(){
  document.getElementById('pinGate').style.display='none';
  document.getElementById('app').style.display='flex';
  bootApp();
}

/* ---------------------- 데이터 로드 ---------------------- */
async function loadAllData(){
  const cfg = await dbGet('config') || {};
  STATE.termId = cfg.currentTerm || defaultTermId();
  const termCfg = (cfg.terms && cfg.terms[STATE.termId]) || {};
  STATE.targetSessions = termCfg.targetSessions || 0;
  STATE.periodTimes = cfg.periodTimes || DEFAULT_PERIOD_TIMES;

  const t = STATE.termId;
  STATE.timetable = await dbGet(`timetable/${t}`) || {};
  STATE.academicCalendar = await dbGet(`academicCalendar/${t}`) || {};
  STATE.periodOverrides = await dbGet(`periodOverrides/${t}`) || {};
  STATE.dayOverrides = await dbGet(`dayOverrides/${t}`) || {};
  STATE.students = await dbGet(`students/${t}`) || {};
  STATE.progress = await dbGet(`progress/${t}`) || {};
  STATE.studentRecords = await dbGet(`studentRecords/${t}`) || {};
  STATE.personalEvents = await dbGet(`personalEvents/${t}`) || {};
}

async function bootApp(){
  await loadAllData();
  renderCalendar();
  renderQuickBanner();
  setInterval(renderQuickBanner, 60000);
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  const tabbar=document.getElementById('tabbar');
  if(name==='daydetail'){ tabbar.classList.add('hidden'); }
  else{

  }
  if(name==='progress') renderProgressScreen();
  if(name==='students') renderStudentsScreen();
  if(name==='settings') renderSettingsScreen();
}

/* ---------------------- 날짜상세 화면: 왼쪽 가장자리에서 오른쪽으로 스와이프하면 뒤로가기 ----------------------
   iOS의 시스템 제스처(화면 왼쪽 끝에서 오른쪽으로 스와이프)는 사파리 자체 기능이라
   홈 화면에 추가한 앱(standalone)에는 적용되지 않고, 우리 앱 화면 전환에도 그대로
   쓸 수 없어서 비슷하게 동작하는 제스처를 직접 만들어줬어요. */
(function setupSwipeBack(){
  const el = document.getElementById('screen-daydetail');
  if(!el) return;
  const EDGE = 24;       // 화면 왼쪽 가장자리로 인정하는 폭(px)
  const THRESHOLD = 70;  // 뒤로가기로 인정할 최소 이동 거리(px)
  let startX=null, startY=null, tracking=false;
  el.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    if(t.clientX <= EDGE){ startX=t.clientX; startY=t.clientY; tracking=true; }
    else { tracking=false; }
  }, { passive:true });
  el.addEventListener('touchmove', e=>{
    if(!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);
    if(dx > THRESHOLD && dy < 60){
      tracking=false;
      showScreen('calendar');
    }
  }, { passive:true });
  el.addEventListener('touchend', ()=>{ tracking=false; });
})();

/* ======================================================================
   캘린더 화면
   ====================================================================== */
function changeMonth(delta){
  const d = STATE.currentMonthDate;
  STATE.currentMonthDate = new Date(d.getFullYear(), d.getMonth()+delta, 1);
  renderCalendar();
}

function isBlockingAcEntry(acEntry){
  // 행사(진도포함)은 실제로 수업·진도 기록이 이뤄지는 날이라 일정에 의해 수업이 막히지 않아요
  return !!acEntry && acEntry.type!=='행사(진도포함)';
}

function getPeriodsForDate(d){
  const dk = dateKey(d);
  const acEntry = Object.values(STATE.academicCalendar).find(e=> dk>=e.start && dk<=e.end);
  const dayOv = STATE.dayOverrides[dk];
  const dayIdx = d.getDay();
  const dayKey = dayOv ? dayOv.weekday : WEEKDAY_EN[dayIdx];
  const periodsForDay = STATE.timetable[dayKey] || {};
  const overridesForDay = STATE.periodOverrides[dk] || {};
  // 기본 시간표에 있는 교시 + (원래 시간표엔 없지만) 추가/이동으로 생긴 교시를 모두 합쳐요
  const periodSet = new Set([
    ...Object.keys(periodsForDay).filter(p=>periodsForDay[p]),
    ...Object.keys(overridesForDay)
  ]);
  const periods = Array.from(periodSet).sort((a,b)=>Number(a)-Number(b));
  return periods.map(p=>{
    const baseCls = periodsForDay[p];
    let entry = {period:Number(p), cls:baseCls};
    if(isBlockingAcEntry(acEntry)){
      entry.status='holiday'; entry.holidayType=acEntry.type; entry.holidayMemo=acEntry.memo;
      return entry;
    }
    if(acEntry) entry.eventNote = acEntry.memo; // 행사(진도포함): 정상 수업으로 취급하되 안내만 붙여줘요
    const ov = overridesForDay[p];
    if(ov){
      if(ov.type==='swap'){
        entry.cls = ov.cls;
        entry.originalCls = baseCls;
        entry.status = 'swap';
        entry.movedFrom = ov.movedFrom || null;
        entry.progressEntry = findProgressEntry(ov.cls, dk, Number(p));
        return entry;
      }
      if(ov.type==='moved'){
        entry.cls = ov.cls || baseCls;
        entry.status = 'moved';
        entry.movedTo = ov.movedTo;
        return entry;
      }
      entry.status = ov.type; entry.overrideMemo = ov.memo; entry.countSession = !!ov.countSession;
      return entry;
    }
    if(!baseCls){
      // 원래 시간표에도 없고 override도 없는데 목록에 들어온 경우는 없지만, 방어적으로 처리
      entry.status = 'unrecorded';
      return entry;
    }
    const rec = findProgressEntry(baseCls, dk, Number(p));
    entry.status = rec ? 'recorded' : 'unrecorded';
    entry.progressEntry = rec;
    return entry;
  });
}

function getAllClassNames(){
  const set = new Set();
  Object.values(STATE.timetable).forEach(day=>{
    Object.values(day||{}).forEach(cls=>{ if(cls) set.add(cls); });
  });
  return Array.from(set).sort();
}

function findProgressEntry(cls, dk, period){
  const list = STATE.progress[cls] || {};
  for(const id in list){ if(list[id].date===dk && list[id].period===period) return {...list[id], id}; }
  return null;
}

function renderCalendar(){
  const d = STATE.currentMonthDate;
  document.getElementById('monthLabel').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월`;
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const totalCells = Math.ceil((startWeekday+daysInMonth)/7)*7;

  let html='';
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startWeekday + 1;
    if(dayNum<1 || dayNum>daysInMonth){ html+=`<div class="day-cell other-month"></div>`; continue; }
    const cellDate = new Date(d.getFullYear(), d.getMonth(), dayNum);
    const dk = dateKey(cellDate);
    const isToday = dk===todayKey();
    const acEntry = Object.values(STATE.academicCalendar).find(e=> dk>=e.start && dk<=e.end);
    let dots='';
    let holidayClass='';
    if(isBlockingAcEntry(acEntry)){
      // 공휴일·시험기간·방학·행사(진도미포함)은 그날 수업이 있는지 여부와 상관없이 항상 표시돼요
      holidayClass='holiday-cell';
      dots = `<div class="dots"><span class="dot gray"></span></div>`;
    } else {
      // 학사일정이 없거나 행사(진도포함)인 날은 실제 수업처럼 기록완료/미기록으로 표시돼요
      const periods = getPeriodsForDate(cellDate);
      if(periods.length){
        const hasUnrecorded = periods.some(p=>p.status==='unrecorded' || (p.status==='swap' && !p.progressEntry));
        dots = `<div class="dots"><span class="dot ${hasUnrecorded?'orange':'blue'}"></span></div>`;
      }
    }
    html += `<button class="day-cell ${isToday?'today':''} ${holidayClass}" onclick="openDayDetail('${dk}')">
      <div class="dnum">${dayNum}</div>${dots}
    </button>`;
  }
  document.getElementById('dayGrid').innerHTML = html;
}

function getNowPeriod(){
  const now = new Date();
  const hhmm = now.getHours()*60+now.getMinutes();
  for(const p in STATE.periodTimes){
    const [s,e] = STATE.periodTimes[p].split('-');
    const [sh,sm] = s.split(':').map(Number); const [eh,em]=e.split(':').map(Number);
    const start=sh*60+sm, end=eh*60+em;
    if(hhmm>=start && hhmm<=end) return Number(p);
  }
  return null;
}

function renderQuickBanner(){
  const nowPeriod = getNowPeriod();
  const sub = document.getElementById('qbSub');
  const main = document.getElementById('qbMain');
  if(!nowPeriod){ sub.textContent='지금'; main.textContent='진행 중인 수업 없음'; return; }
  const now = new Date();
  const dk = dateKey(now);
  const acEntry = Object.values(STATE.academicCalendar).find(e=> dk>=e.start && dk<=e.end);
  if(isBlockingAcEntry(acEntry)){ sub.textContent='지금 · '+nowPeriod+'교시'; main.textContent=acEntry.type||'휴업일'; return; }
  const dayOv = STATE.dayOverrides[dk];
  const dayKey = dayOv ? dayOv.weekday : WEEKDAY_EN[now.getDay()];
  let cls = (STATE.timetable[dayKey]||{})[nowPeriod];
  const ov = (STATE.periodOverrides[dk]||{})[nowPeriod];
  if(ov && ov.type==='swap') cls = ov.cls;
  else if(ov && ov.type==='moved'){ sub.textContent='지금 · '+nowPeriod+'교시'; main.textContent='다른 날짜로 이동됨'; return; }
  else if(ov && (ov.type==='event'||ov.type==='other')){ sub.textContent='지금 · '+nowPeriod+'교시'; main.textContent = ov.type==='event'?'행사':'기타 활동'; return; }
  if(!cls){ sub.textContent='지금 · '+nowPeriod+'교시'; main.textContent='배정된 수업 없음'; return; }
  sub.textContent = `지금 · ${nowPeriod}교시 진행 중`;
  main.textContent = `${cls} 수학`;
}
function goQuickRecord(){
  openDayDetail(todayKey());
}

/* ======================================================================
   날짜상세 화면
   ====================================================================== */
function openDayDetail(dk){
  STATE.selectedDateKey = dk;
  const d = parseDateKey(dk);
  document.getElementById('ddTitle').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAY_KR[d.getDay()]})`;
  renderDayDetail();
  showScreen('daydetail');
}

function renderDayDetail(){
  const dk = STATE.selectedDateKey;
  const d = parseDateKey(dk);
  const periods = getPeriodsForDate(d);
  const acEntry = Object.values(STATE.academicCalendar).find(e=> dk>=e.start && dk<=e.end);
  const dayOv = STATE.dayOverrides[dk];
  let html = `<div class="section-label" style="display:flex;justify-content:space-between;align-items:center;">
    <span>오늘의 수업</span>
    <button class="link-btn" style="margin:0;" onclick="openDayOverrideModal()">요일 전체 교체</button>
  </div>`;
  if(dayOv){
    const idx = DAY_LABELS_5.indexOf(dayOv.weekday);
    html += `<div class="card" style="background:#F9FAFB;">
      <div class="sub" style="color:#6B7280;">오늘은 <b>${idx>=0?DAY_LABELS_5_KR[idx]:dayOv.weekday}요일</b> 시간표대로 운영해요.</div>
      <button class="link-btn" onclick="clearDayOverride()">되돌리기</button>
    </div>`;
  }

  if(isBlockingAcEntry(acEntry)){
    // 공휴일·시험기간·방학·행사(진도미포함) 등 실제 수업이 없는 날은 교시별로 반복하지 않고 안내 카드 하나만 보여줘요
    html += `<div class="card">
      <div class="card-top"><div class="cname">${acEntry.type||'학사일정'}</div><div class="badge gray">${acEntry.type||'휴업일'}</div></div>
      <div class="sub">${acEntry.memo||''}</div>
    </div>`;
  } else {
    if(acEntry){
      // 행사(진도포함): 진도는 정상적으로 기록하되, 오늘 무슨 행사인지만 안내해줘요
      html += `<div class="card" style="background:#F9FAFB;">
        <div class="sub" style="color:#6B7280;">오늘은 <b>${acEntry.type}</b>인 날이에요: ${acEntry.memo||''} (수업·진도 기록은 평소처럼 해주세요)</div>
      </div>`;
    }
    if(!periods.length){
      html += `<div class="empty-hint">이 날은 시간표상 수업이 없어요.</div>`;
    }
    periods.forEach(p=>{
      if(p.status==='event'){
        html += `<div class="card">
          <div class="card-top"><div class="cname">${p.period}교시 · ${p.cls}</div><div class="badge gray">행사</div></div>
          <div class="sub">${p.overrideMemo||''} (진도 차시 미포함)</div>
          <button class="link-btn" onclick="clearOverride('${p.period}')">원래대로 되돌리기</button>
        </div>`;
      } else if(p.status==='other'){
        html += `<div class="card">
          <div class="card-top"><div class="cname">${p.period}교시 · ${p.cls}</div><div class="badge gray">기타 활동</div></div>
          <div class="sub">${p.overrideMemo||''} ${p.countSession?'(진도 차시 포함)':'(진도 차시 미포함)'}</div>
          <div class="card-actions">
            <button class="btn secondary" onclick="openStudentRecordModal('${p.cls}')">학생 기록</button>
            <button class="btn ghost" onclick="clearOverride('${p.period}')">되돌리기</button>
          </div>
        </div>`;
      } else if(p.status==='moved'){
        const isDeleted = !p.movedTo;
        const noteText = isDeleted ? '삭제된 수업이에요.' : `${fmtShort(p.movedTo.date)} ${p.movedTo.period}교시로 이동했어요.`;
        html += `<div class="card">
          <div class="card-top"><div class="cname">${p.period}교시 · ${p.cls||''}</div><div class="badge gray">${isDeleted?'삭제됨':'이동됨'}</div></div>
          <div class="sub" style="color:#6B7280;">${noteText} 이 시간엔 수업이 없어요.</div>
          <button class="link-btn" onclick="clearOverride('${p.period}')">되돌리기</button>
        </div>`;
      } else if(p.status==='swap'){
        const swapNote = p.originalCls && p.originalCls!==p.cls ? `<div class="sub" style="color:#9CA3AF;">원래 시간표: ${p.originalCls}</div>` : '';

async function clearOverride(period){
  const dk = STATE.selectedDateKey;

  if(ov){
    let pairDk=null, pairPeriod=null;
    if(ov.movedFrom){ pairDk=ov.movedFrom.date; pairPeriod=ov.movedFrom.period; }
    else if(ov.movedTo){ pairDk=ov.movedTo.date; pairPeriod=ov.movedTo.period; }

  renderCalendar();
}

async function saveProgress(cls, period, seq, startPoint, existingId){
  const material = document.getElementById('pf_material').value;
  const endPoint = document.getElementById('pf_end').value.trim();
  const note = document.getElementById('pf_note').value.trim();
  if(!endPoint){ alert('어디까지 나갔는지 입력해주세요'); return; }
  const existingEntry = existingId ? (STATE.progress[cls]||{})[existingId] : null;
  const data = {seq, date:STATE.selectedDateKey, period, cls, material, startPoint:startPoint||'', endPoint, unit:(existingEntry?existingEntry.unit||'':''), note, createdAt:Date.now()};
  if(existingId){
    await dbSet(`progress/${STATE.termId}/${cls}/${existingId}`, data);
    STATE.progress[cls][existingId]=data;
  } else {
    const res = await dbPush(`progress/${STATE.termId}/${cls}`, data);
    STATE.progress[cls] = STATE.progress[cls]||{};
    STATE.progress[cls][res.name]=data;
  }
  closeModal();
  renderDayDetail();
  renderCalendar();
}

/* ---------------------- 이동/추가 짝(pair) 정리 유틸 ---------------------- */
function getPeriodOptions(){
  const keys = Object.keys(STATE.periodTimes);
  if(keys.length) return keys.sort((a,b)=>Number(a)-Number(b));
  return ['1','2','3','4','5','6','7'];
}
// (dk,period) 자리를 덮어쓰기 전에, 그 자리가 이동으로 생긴 짝이 있다면
// 상대방 쪽의 연결 표시만 없애고(수업 내용은 그대로 유지) 정리해줘요.
async function unlinkPartnerIfAny(dk, period){
  const ov = (STATE.periodOverrides[dk]||{})[period];
  if(!ov) return;
  let pairDk=null, pairPeriod=null;
  if(ov.movedFrom){ pairDk=ov.movedFrom.date; pairPeriod=ov.movedFrom.period; }
  else if(ov.movedTo){ pairDk=ov.movedTo.date; pairPeriod=ov.movedTo.period; }
  if(pairDk==null) return;
  const pairOv = (STATE.periodOverrides[pairDk]||{})[pairPeriod];
  if(!pairOv) return;
  const cleaned = {...pairOv};
  delete cleaned.movedFrom;
  delete cleaned.movedTo;
  await dbSet(`periodOverrides/${STATE.termId}/${pairDk}/${pairPeriod}`, cleaned);
  STATE.periodOverrides[pairDk] = STATE.periodOverrides[pairDk]||{};
  STATE.periodOverrides[pairDk][pairPeriod] = cleaned;
}
// (dk,period) 자리를 완전히 삭제할 때 쓰는 버전. 이동으로 생긴 짝이 있다면
// 상대방 쪽도 함께 "삭제됨"으로 바꿔서, 그 수업이 어느 쪽에서도 열리지 않게 해줘요.
async function cascadeCancelPartner(dk, period){
  const ov = (STATE.periodOverrides[dk]||{})[period];
  if(!ov) return;
  let pairDk=null, pairPeriod=null;
  if(ov.movedFrom){ pairDk=ov.movedFrom.date; pairPeriod=ov.movedFrom.period; }
  else if(ov.movedTo){ pairDk=ov.movedTo.date; pairPeriod=ov.movedTo.period; }
  if(pairDk==null) return;
  const pairOv = (STATE.periodOverrides[pairDk]||{})[pairPeriod];
  if(!pairOv) return;
  const cancelled = {type:'moved', cls: pairOv.cls, movedTo:null};
  await dbSet(`periodOverrides/${STATE.termId}/${pairDk}/${pairPeriod}`, cancelled);
  STATE.periodOverrides[pairDk] = STATE.periodOverrides[pairDk]||{};
  STATE.periodOverrides[pairDk][pairPeriod] = cancelled;
}

/* ---------------------- 모달: 다른 날짜·교시로 이동 ---------------------- */
function openMoveModal(period, cls){
  const dk = STATE.selectedDateKey;
  const periodOpts = getPeriodOptions();
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-title"><span>${period}교시 · ${cls} 다른 날짜로 이동</span><button onclick="closeModal()">✕</button></div>
    <div style="font-size:11.5px;color:#9CA3AF;margin-top:-4px;">이 수업을 다른 날짜·교시에 하게 됐다면 이동해주세요. 원래 시간(오늘 ${period}교시)은 수업 없음으로 바뀌고, 진도는 이동한 날짜·교시에서 기록하면 돼요.</div>
    <div class="field"><label>이동할 날짜</label><input id="mv_date" type="date" value="${dk}"></div>
    <div class="field"><label>이동할 교시</label>
      <select id="mv_period">${periodOpts.map(p=>`<option value="${p}" ${p===String(period)?'selected':''}>${p}교시</option>`).join('')}</select></div>
    <button class="btn primary full" onclick="saveMove('${period}','${cls}')">저장</button>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}
async function saveMove(period, cls){
  const fromDk = STATE.selectedDateKey;
  const toDk = document.getElementById('mv_date').value;
  const toPeriod = document.getElementById('mv_period').value;
  if(!toDk){ alert('날짜를 선택해주세요'); return; }
  if(toDk===fromDk && String(toPeriod)===String(period)){ alert('같은 날짜·교시로는 이동할 수 없어요'); return; }
  const destPeriods = getPeriodsForDate(parseDateKey(toDk));
  const destExisting = destPeriods.find(p=>p.period===Number(toPeriod));
  if(destExisting){
    if(!confirm(`${fmtShort(toDk)} ${toPeriod}교시엔 이미 ${destExisting.cls||'다른'} 수업(또는 일정)이 있어요. 덮어쓸까요?`)) return;
  }
  await unlinkPartnerIfAny(toDk, toPeriod);
  await unlinkPartnerIfAny(fromDk, period);
  const destData = {type:'swap', cls, movedFrom:{date:fromDk, period:Number(period)}};
  const srcData = {type:'moved', cls, movedTo:{date:toDk, period:Number(toPeriod)}};
  await dbSet(`periodOverrides/${STATE.termId}/${toDk}/${toPeriod}`, destData);
  await dbSet(`periodOverrides/${STATE.termId}/${fromDk}/${period}`, srcData);
  STATE.periodOverrides[toDk] = STATE.periodOverrides[toDk]||{};
  STATE.periodOverrides[toDk][toPeriod] = destData;
  STATE.periodOverrides[fromDk] = STATE.periodOverrides[fromDk]||{};
  STATE.periodOverrides[fromDk][period] = srcData;
  closeModal(); renderDayDetail(); renderCalendar();
}

/* ---------------------- 수업 삭제 (원래 있던 수업이 그냥 없어지는 경우) ---------------------- */
async function deleteClassPeriod(period, cls){
  if(!confirm(`${period}교시 ${cls} 수업을 삭제할까요? 이 시간은 수업 없음으로 바뀌어요.`)) return;
  const dk = STATE.selectedDateKey;
  const existingProgress = findProgressEntry(cls, dk, Number(period));
  if(existingProgress){
    if(confirm('이미 기록된 진도가 있어요. 진도 기록도 함께 삭제할까요?')){
      await dbRemove(`progress/${STATE.termId}/${cls}/${existingProgress.id}`);
      if(STATE.progress[cls]) delete STATE.progress[cls][existingProgress.id];
    }
  }
  // 이동해 온 수업이었다면, 원래 있던 자리도 함께 "삭제됨"으로 바뀌어요 (그 수업은 어디서도 열리지 않으니까요)
  await cascadeCancelPartner(dk, period);
  const data = {type:'moved', cls, movedTo:null};
  await dbSet(`periodOverrides/${STATE.termId}/${dk}/${period}`, data);
  STATE.periodOverrides[dk] = STATE.periodOverrides[dk]||{};
  STATE.periodOverrides[dk][period]=data;
  renderDayDetail(); renderCalendar();
}

      </select></div>

async function saveAddPeriod(){
  const dk = STATE.selectedDateKey;
  const period = document.getElementById('ap_period').value;
  const sel = document.getElementById('ap_cls').value;
  const cls = sel==='__custom__' ? document.getElementById('ap_custom').value.trim() : sel;

    <div style="font-size:11px;color:#9CA3AF;margin-top:-6px;">이미지는 자동으로 용량을 줄여서 저장돼요. 문서 파일은 2MB 이하로 올려주세요.</div>
    <button class="btn primary full" onclick="savePersonalEvent()">저장</button>
  `;

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function compressImageFile(file, maxDim=1280, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let width=img.width, height=img.height;
        if(width>maxDim || height>maxDim){
          if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
          else{ width=Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('이미지를 읽을 수 없어요'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function savePersonalEvent(){
  const category = document.getElementById('pe_category').value;
  const time = document.getElementById('pe_time').value;
  const text = document.getElementById('pe_text').value.trim();
  const link = document.getElementById('pe_link').value.trim();
  const file = document.getElementById('pe_file').files[0];
  if(!text){ alert('내용을 입력해주세요'); return; }
  const data = {category,time,text};
  if(link) data.link = link;
  if(file){
    const MAX_DOC_SIZE = 2*1024*1024;
    try{
      if(file.type.startsWith('image/')){
        data.fileData = await compressImageFile(file);
        data.fileName = file.name;
        data.fileType = 'image';
      } else {
        if(file.size > MAX_DOC_SIZE){ alert('파일이 너무 커요. 2MB 이하 파일을 선택해주세요.'); return; }
        data.fileData = await readFileAsDataURL(file);
        data.fileName = file.name;
        data.fileType = file.type || 'file';
      }
    }catch(e){
      alert('파일을 읽는 중 문제가 생겼어요. 다시 시도해주세요.');
      return;
    }
  }
  const dk = STATE.selectedDateKey;
  const res = await dbPush(`personalEvents/${STATE.termId}/${dk}`, data);
  STATE.personalEvents[dk]=STATE.personalEvents[dk]||{};
  STATE.personalEvents[dk][res.name]=data;
  closeModal(); renderDayDetail();
}

function downloadCSV(rows, filename){
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

    <div class="cal-row-item">
      <div style="width:110px;">${fmtShort(e.start)}${e.end!==e.start?` ~ ${fmtShort(e.end)}`:''}</div>
      <div class="badge ${e.type==='시험기간'?'orange':(e.type==='방학'||e.type==='행사(진도포함)'?'':'gray')}" style="${e.type==='방학'?'color:#7C3AED;background:#F3E8FF;':(e.type==='행사(진도포함)'?'color:#16A34A;background:#DCFCE7;':'')}">${e.type}</div>
      <div style="flex:1;">${e.memo||''}</div>
      <button class="iconbtn" onclick="openAcademicModal('${id}')">✎</button>
      <button class="iconbtn" onclick="deleteAcademic('${id}')">✕</button>
    </div>`).join('');
}

function openAcademicModal(id){
  const existing = id ? STATE.academicCalendar[id] : null;
  const typeOptions = ['공휴일','시험기간','방학','행사(진도포함)','행사(진도미포함)'];
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-title"><span>학사일정 ${existing?'수정':'추가'}</span><button onclick="closeModal()">✕</button></div>
    <div class="field"><label>시작일</label><input id="ac_start" type="date" value="${existing?existing.start:''}"></div>
    <div class="field"><label>종료일 (하루면 동일하게)</label><input id="ac_end" type="date" value="${existing?existing.end:''}"></div>
    <div class="field"><label>구분</label><select id="ac_type">${typeOptions.map(t=>`<option ${existing&&existing.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div style="font-size:11px;color:#9CA3AF;margin-top:-6px;">행사(진도포함)은 실제 수업·진도 기록이 이뤄지는 날이라 달력에도 평소 수업처럼 표시돼요. 행사(진도미포함)은 공휴일처럼 수업이 없는 날로 표시돼요.</div>
    <div class="field"><label>메모</label><input id="ac_memo" placeholder="예: 개천절" value="${existing?(existing.memo||''):''}"></div>
    <button class="btn primary full" onclick="saveAcademic(${existing?`'${id}'`:'null'})">저장</button>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}
async function saveAcademic(id){
  const start = document.getElementById('ac_start').value;
  const end = document.getElementById('ac_end').value || start;
  const type = document.getElementById('ac_type').value;
  const memo = document.getElementById('ac_memo').value.trim();
  if(!start){ alert('날짜를 입력해주세요'); return; }
  const data = {start,end,type,memo};
  if(id){
    await dbSet(`academicCalendar/${STATE.termId}/${id}`, data);
    STATE.academicCalendar[id]=data;
  } else {
    const res = await dbPush(`academicCalendar/${STATE.termId}`, data);
    STATE.academicCalendar[res.name]=data;
  }
  closeModal(); renderSettingsScreen(); renderCalendar();
}
async function deleteAcademic(id){
  await dbRemove(`academicCalendar/${STATE.termId}/${id}`);
  delete STATE.academicCalendar[id];
  renderSettingsScreen(); renderCalendar();
}

/* ---------------------- 공휴일 자동 가져오기 (무료 공개 API, 별도 키 필요 없음) ---------------------- */
let HOLIDAY_FETCH_RESULT = [];
function openHolidayImportModal(){
  const year = STATE.currentMonthDate.getFullYear();
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-title"><span>공휴일 자동으로 가져오기</span><button onclick="closeModal()">✕</button></div>
    <div style="font-size:11.5px;color:#9CA3AF;margin-bottom:10px;">공개 공휴일 데이터를 불러와요. 학기가 두 해에 걸쳐 있으면 연도를 바꿔서 한 번 더 불러오시면 돼요.</div>
    <div class="field"><label>연도</label><input id="hi_year" type="number" value="${year}"></div>
    <button class="btn primary full" onclick="fetchHolidays()">불러오기</button>
    <div id="hi_list" style="margin-top:12px;"></div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}
async function fetchHolidays(){
  const year = document.getElementById('hi_year').value;
  const listEl = document.getElementById('hi_list');
  listEl.innerHTML = '<div class="empty-hint">불러오는 중...</div>';
  try{
    const res = await fetch(`https://date.nager.at/api/v3/publicholidays/${year}/KR`);
    if(!res.ok) throw new Error(res.status);
    const list = await res.json();
    HOLIDAY_FETCH_RESULT = list;
    if(!list.length){ listEl.innerHTML = '<div class="empty-hint">해당 연도의 공휴일 정보가 없어요.</div>'; return; }
    listEl.innerHTML = list.map((h,i)=>{
      const exists = Object.values(STATE.academicCalendar).some(e=>e.start===h.date && e.type==='공휴일');
      return `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;">
        <input type="checkbox" class="hi-check" data-idx="${i}" ${exists?'':'checked'} style="width:auto;flex:none;">
        <span style="flex:1;">${h.date} · ${h.localName||h.name}</span>
        ${exists?'<span style="font-size:10.5px;color:#9CA3AF;">이미 있음</span>':''}
      </label>`;
    }).join('') + `<button class="btn primary full" style="margin-top:10px;" onclick="applyHolidayImport()">선택한 항목 추가</button>`;
  }catch(e){
    listEl.innerHTML = '<div class="empty-hint">불러오기 실패 · 인터넷 연결을 확인해주세요</div>';
  }
}
async function applyHolidayImport(){
  const checks = document.querySelectorAll('#hi_list .hi-check:checked');
  let count = 0;
  for(const chk of checks){
    const h = HOLIDAY_FETCH_RESULT[Number(chk.dataset.idx)];
    if(!h) continue;
    const data = {start:h.date, end:h.date, type:'공휴일', memo:h.localName||h.name};
    const res = await dbPush(`academicCalendar/${STATE.termId}`, data);
    STATE.academicCalendar[res.name] = data;
    count++;
  }
  closeModal();
  renderSettingsScreen(); renderCalendar();
  toast(count ? `${count}개의 공휴일을 추가했어요` : '선택된 항목이 없어요', count?'ok':'error');
}

/* ---------------------- 학생 명단 업로드 ---------------------- */
let ROSTER_RAW_ROWS = [];
function handleRosterFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let rows;
    if(file.name.endsWith('.csv')){
      rows = e.target.result.split(/\r?\n/).filter(r=>r.trim()!=='').map(r=>r.split(','));
    } else {
      const wb = XLSX.read(e.target.result, {type:'binary'});
      rows = [];
      wb.SheetNames.forEach(name=>{
        const sheet = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1});
        sheet.forEach(r=>{ if(r.length) rows.push(r.map(v=>String(v??'').trim())); });
      });
    }
    ROSTER_RAW_ROWS = rows;
    showRosterMatch(rows);
  };
  if(file.name.endsWith('.csv')) reader.readAsText(file, 'utf-8');
  else reader.readAsBinaryString(file);
}

function showRosterMatch(rows){
  if(!rows.length){ document.getElementById('rosterMatchArea').innerHTML='<div class="empty-hint">읽을 내용이 없어요.</div>'; return; }
  const header = rows[0];
  const colOptions = header.map((h,i)=>`<option value="${i}">${h||('열'+(i+1))}</option>`).join('');
  document.getElementById('rosterMatchArea').innerHTML = `
    <div style="margin-top:10px;font-size:12px;color:#6B7280;">${rows.length-1}행 감지됨. 어떤 열이 무엇인지 확인해주세요.</div>
    <div class="field"><label>반</label><select id="rc_class">${colOptions}</select></div>
    <div class="field"><label>번호</label><select id="rc_number">${colOptions}</select></div>
    <div class="field"><label>이름</label><select id="rc_name">${colOptions}</select></div>
    <button class="btn primary full" onclick="applyRoster()">명단 적용하기</button>
  `;
}

async function applyRoster(){
  const ci = Number(document.getElementById('rc_class').value);
  const ni = Number(document.getElementById('rc_number').value);
  const nmi = Number(document.getElementById('rc_name').value);
  const rows = ROSTER_RAW_ROWS.slice(1);
  const updates = {};
  rows.forEach(r=>{
    if(!r[nmi]) return;
    const id = 's_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    updates[id] = {class:r[ci]||'', number:Number(r[ni])||0, name:r[nmi]};
  });
  await dbSet(`students/${STATE.termId}`, {...STATE.students, ...updates});
  STATE.students = {...STATE.students, ...updates};
  document.getElementById('rosterMatchArea').innerHTML = `<div class="empty-hint">${Object.keys(updates).length}명이 등록됐어요.</div>`;
  renderSettingsScreen();
}
